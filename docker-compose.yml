services:
  postgres:
    image: postgis/postgis:15-3.3
    environment:
      POSTGRES_DB: sentrax
      POSTGRES_USER: sentrax
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentrax"]
      interval: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s

  backend:
    build: ./backend
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8002}:8000"
    volumes:
      - ./backend:/app
      - media_storage:/app/media
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  celery:
    build: ./backend
    env_file: .env
    depends_on:
      - backend
      - redis
    command: celery -A app.tasks worker --loglevel=info -c 4
    volumes:
      - ./backend:/app
      - media_storage:/app/media

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-3002}:3000"
    environment:
      - VITE_API_URL=http://localhost:8002
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
  media_storage:
